[package]
name = "photobook-sequencer"
version = "0.1.0"
description = "A tool for prototyping photo sequences"
authors = ["Salem Hilal"]
license = "MIT"
repository = "https://github.com/salemhilal/photobook-sequencer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "photobook_sequencer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[features]
# Built in only for the end-to-end test (npm run test:app).
e2e = []
