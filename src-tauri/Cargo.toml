[package]
name = "sequence"
version = "0.1.1"
description = "A tool for playing with photo sequences"
authors = ["Salem Hilal"]
license = "MIT"
repository = "https://github.com/salemhilal/sequence.photos"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sequence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Security-scoped bookmarks (see mod bookmarks in src/lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL"] }

[features]
# Built in only for the end-to-end test (npm run test:app).
e2e = []
