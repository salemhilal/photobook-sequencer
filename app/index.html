<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#151514" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequence</title>
    <meta property="og:url" content="https://%VITE_SITE_DOMAIN%/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sequence" />
    <meta property="og:title" content="Sequence" />
    <meta property="og:description" content="A tool for playing with photo sequences." />
    <!-- The thumbnail when a link is shared (Messages, Slack, social sites): public/og.jpg. -->
    <meta property="og:image" content="https://%VITE_SITE_DOMAIN%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Photos spread out on Sequence's desk, with the book's spreads beside them" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved light/dark choice before first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem('photobook-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var d = localStorage.getItem('photobook-desk');
        if (d && /^#[0-9a-f]{6}$/i.test(d)) document.documentElement.style.setProperty('--desk', d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
