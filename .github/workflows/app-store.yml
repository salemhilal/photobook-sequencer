# Builds the Mac app, tests it end to end, and uploads it to App Store Connect (where
# it shows up in TestFlight, ready to submit). Runs when a GitHub release is published
# (its tag must be v + package.json's version, e.g. v0.2.0), or by hand: Actions → App
# Store → Run workflow.
#
# Secrets it needs (Settings → Secrets and variables → Actions):
#   APP_STORE_CERTIFICATES      base64 of a .p12 holding the "Apple Distribution" and
#                               "3rd Party Mac Developer Installer" certificates and keys
#   APP_STORE_CERTIFICATES_PASSWORD   the .p12's password
#   APP_STORE_PROFILE           base64 of the app's Mac App Store provisioning profile
#   APP_STORE_API_KEY_ID        an App Store Connect API key (Users and Access → Integrations),
#   APP_STORE_API_ISSUER        its issuer ID,
#   APP_STORE_API_KEY           and the key file's contents (AuthKey_<id>.p8)
#
# The build number (CFBundleVersion) counts commits, so each upload's is higher.

name: App Store

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts commits (see scripts/app-store.mjs).
          fetch-depth: 0
      - name: Check the release matches the app's version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The release is $TAG, but package.json says $VERSION. Bump the version and tag to match."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run test:app

      - name: Install the signing certificates and profile
        env:
          CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.APP_STORE_PROFILE }}
          API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile
          echo "$API_KEY" > "$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"

      - name: Build and upload
        env:
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
        run: APP_STORE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_API_KEY_ID.p8" npm run app:store
