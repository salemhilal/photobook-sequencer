name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Type-checks everything (including tests) and builds the site.
      - run: npm run build
      - run: node scripts/check-web-bundle.mjs
      # The Mac app's web side (its native side needs macOS; see npm run test:app).
      - run: npm run build:web-ui-for-app
      - run: node scripts/check-app-bundle.mjs
